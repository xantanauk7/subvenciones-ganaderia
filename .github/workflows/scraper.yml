# .github/workflows/scraper.yml
# Ejecuta el scraper automáticamente cada 14 días
# También se puede lanzar manualmente desde GitHub Actions → Run workflow

name: Scraper subvenciones ganadería

on:
  schedule:
    - cron: '0 7 1,15 * *'   # Días 1 y 15 de cada mes a las 7:00 UTC
  workflow_dispatch:           # Permite lanzarlo manualmente

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/scraper.py

  
